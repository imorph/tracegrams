name: ci
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: short
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: test / ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, toolchain: stable }
          - { os: ubuntu-latest, toolchain: beta }
          - { os: macos-latest, toolchain: stable }
          - { os: windows-latest, toolchain: stable }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # tag=v1
        with: { toolchain: "${{ matrix.toolchain }}" }
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # tag=v2.87.1
        with: { tool: just }
      - run: just test

  # Release builds elide debug assertions; the fixed-seed properties must
  # still agree with the independent models without them.
  release-properties:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # tag=v1
        with: { toolchain: stable }
      - run: cargo test --locked --all-features --release --test it recorder_state_machine_matches_independent_model
      - run: cargo test --locked --all-features --release --test it diagnosis_scores_match_raw_event_oracle
      - run: cargo test --locked --all-features --release --lib clocked_sequences_match_manual_across_freeze

  mutants-diff:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # tag=v1
        with: { toolchain: stable }
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # tag=v2.87.1
        with: { tool: cargo-mutants }
      - name: Diff changed lines
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          elif [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git hash-object -t tree /dev/null)"
          else
            base="$BASE_SHA"
          fi
          git diff --no-ext-diff --no-color --no-renames --unified=0 "$base" "$HEAD_SHA" -- > git.diff
      - run: cargo mutants --in-diff git.diff --in-place
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # tag=v7.0.0
        if: always()
        with:
          name: mutants-diff
          path: mutants.out

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # tag=v1
        with: { toolchain: stable, components: rustfmt }
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # tag=v2.87.1
        with: { tool: just }
      - run: just fmt-check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # tag=v1
        with: { toolchain: stable, components: clippy }
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # tag=v2.87.1
        with: { tool: just }
      - run: just clippy

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # tag=v1
        with: { toolchain: nightly }
      - uses: dtolnay/install@982daea0f5d846abc3c83e01a6a1d73c040047c1 # branch=cargo-docs-rs
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # tag=v2.87.1
        with: { tool: just }
      - run: just doc

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # tag=v1
        with: { toolchain: "1.85.0" }
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # tag=v2.87.1
        with: { tool: just }
      - run: just msrv-check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # tag=v2.87.1
        with: { tool: "just,cargo-deny" }
      - run: just deny

  actions-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # tag=v2.87.1
        with: { tool: "just,zizmor" }
      - run: just actions-check

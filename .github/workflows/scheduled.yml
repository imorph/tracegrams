name: rolling
permissions:
  contents: read
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: short
  RUSTFLAGS: -Dwarnings

jobs:
  nightly-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # tag=v1
        with: { toolchain: nightly }
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # tag=v2.87.1
        with: { tool: just }
      - run: just test

  rolling-properties:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # tag=v1
        with: { toolchain: stable }
      - name: Pick and print a reproducible random seed
        shell: bash
        run: |
          seed="$(openssl rand -hex 32)"
          echo "TRACEGRAMS_PROPTEST_SEED=$seed" | tee -a "$GITHUB_ENV"
      - run: cargo test --locked --all-features --release --test it recorder_state_machine_matches_independent_model -- --nocapture
        env: { TRACEGRAMS_PROPTEST_CASES: "960" }
      - run: cargo test --locked --all-features --release --test it diagnosis_scores_match_raw_event_oracle -- --nocapture
        env: { TRACEGRAMS_PROPTEST_CASES: "640" }
      - run: cargo test --locked --all-features --release --lib clocked_sequences_match_manual_across_freeze -- --nocapture
        env: { TRACEGRAMS_PROPTEST_CASES: "960" }
      - run: cargo test --locked --all-features --release --lib nearest_rank_matches_exact_rational_oracle_and_is_monotonic -- --nocapture
        env: { TRACEGRAMS_PROPTEST_CASES: "2560" }
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # tag=v7.0.0
        if: always()
        with:
          name: property-regressions
          path: proptest-regressions

  latest-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # tag=v1
        with: { toolchain: stable }
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # tag=v2.87.1
        with: { tool: just }
      - run: just test-latest-deps

  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # tag=v1
        with: { toolchain: stable }
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # tag=v2.87.1
        with: { tool: cargo-mutants }
      - run: cargo mutants --in-place
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # tag=v7.0.0
        if: always()
        with:
          name: mutants-full
          path: mutants.out

  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # tag=v1
        with: { toolchain: stable }
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # tag=v2.87.1
        with: { tool: "just,cargo-deny" }
      - run: just deny-advisories

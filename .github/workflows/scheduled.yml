name: rolling
permissions:
  contents: read
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: short
  RUSTFLAGS: -Dwarnings

jobs:
  nightly-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag=v1
        with: { toolchain: nightly }
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # tag=v2.87.2
        with: { tool: just }
      - run: just test

  latest-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag=v1
        with: { toolchain: stable }
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # tag=v2.87.2
        with: { tool: just }
      - run: just test-latest-deps

  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # tag=v1
        with: { toolchain: stable }
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # tag=v2.87.2
        with: { tool: "just,cargo-deny" }
      - run: just deny-advisories

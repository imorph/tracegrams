[package]
name = "tracegrams"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Aggregate tail-latency propagation tracking without storing traces: per-request latency context and per-stage transition matrices at nanosecond checkpoint cost."
readme = "README.md"
repository = "https://github.com/imorph/tracegrams"
license = "MIT OR Apache-2.0"
keywords = ["latency", "tail-latency", "observability", "profiling", "metrics"]
categories = ["development-tools::profiling", "development-tools::debugging", "data-structures"]
include = [
  "/src/**/*.rs",
  "/tests/**/*.rs",
  "/benches/**/*.rs",
  "/examples/**/*.rs",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
]

[features]
default = []

[dependencies]

[dev-dependencies]
divan = "0.1"

[lib]
bench = false

[[bench]]
name = "checkpoint"
harness = false

[[example]]
name = "pipeline"
doc-scrape-examples = false

[profile.bench]
debug = true

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allowed pedantic lints.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
similar_names = "allow"
# Additional restriction lints.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
mem_forget = "warn"
# Performance-related lints.
large_types_passed_by_value = "warn"
inefficient_to_string = "warn"
imprecise_flops = "warn"
lossy_float_literal = "warn"
ptr_as_ptr = "warn"
undocumented_unsafe_blocks = "deny"
